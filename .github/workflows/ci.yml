name: ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Default-output, evidence-semantic, and workspace tests
        run: cargo test --workspace --all-targets --locked
      - name: Reject external process execution in product crates
        shell: bash
        run: |
          if rg -n 'std::process::Command|tokio::process|Command::new' crates/*/src; then
            echo 'product code must not invoke external commands'
            exit 1
          fi
      - name: Reject persistent network-configuration mutation in product crates
        shell: bash
        run: |
          if rg -n 'SetIpForwardEntry|SetIpInterfaceEntry|SetUnicastIpAddressEntry|CreateIpForwardEntry|DeleteIpForwardEntry|SCDynamicStoreSetValue|NetworkManager|networksetup|netsh|nmcli' crates/*/src; then
            echo 'product code must not mutate persistent network configuration'
            exit 1
          fi

  native-conformance-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-x86_64
            binary: reach
          - runner: ubuntu-24.04-arm
            artifact: linux-aarch64
            binary: reach
          - runner: macos-15-intel
            artifact: macos-x86_64
            binary: reach
          - runner: macos-15
            artifact: macos-aarch64
            binary: reach
          - runner: windows-2025
            artifact: windows-x86_64
            binary: reach.exe
          - runner: windows-11-arm
            artifact: windows-aarch64
            binary: reach.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: stable
      - name: Record source, toolchain, lockfile, and runner provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (git rev-parse HEAD).Trim()
          if ($source -ne '${{ github.sha }}') {
            throw "checked-out source $source differs from workflow source ${{ github.sha }}"
          }
          $lockHash = (Get-FileHash Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant()
          $provenance = 'reach-${{ matrix.artifact }}-provenance.txt'
          @(
            "source_sha=$source"
            "cargo_lock_sha256=$lockHash"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "runner_name=$env:RUNNER_NAME"
            "runner_image_os=$env:ImageOS"
            "runner_image_version=$env:ImageVersion"
            "cargo=$(cargo -V)"
            'rustc:'
          ) | Set-Content -Path $provenance
          rustc -Vv | Add-Content -Path $provenance
          Get-Content $provenance
      - name: Native ordinary-user conformance
        run: cargo test --workspace --all-targets --locked -- --nocapture
      - name: Build the native single-file executable
        run: cargo build --release --locked -p reach-cli
      - name: Verify the native executable
        run: cargo run --release --locked -q -p reach-cli -- --version
      - name: Package the one executable without losing Unix mode bits
        run: tar -cf reach-${{ matrix.artifact }}.tar -C target/release ${{ matrix.binary }}
      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reach-0.1.2-${{ matrix.artifact }}
          path: reach-${{ matrix.artifact }}.tar
          archive: false
          if-no-files-found: error
