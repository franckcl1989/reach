name: ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Record the actual unpinned stable toolchain
        run: |
          rustc -Vv
          cargo -V
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Default-output, evidence-semantic, and workspace tests
        run: cargo test --workspace --all-targets --locked
      - name: Install pinned dependency-policy tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked
      - name: Dependency vulnerability gate
        run: cargo audit
      - name: Unused direct dependency gate
        run: cargo machete --with-metadata
      - name: Reject external process execution in product crates
        shell: bash
        run: |
          if rg -n 'std::process::Command|tokio::process|Command::new' crates/*/src; then
            echo 'product code must not invoke external commands'
            exit 1
          fi
      - name: Reject persistent network-configuration mutation in product crates
        shell: bash
        run: |
          if rg -n 'SetIpForwardEntry|SetIpInterfaceEntry|SetUnicastIpAddressEntry|CreateIpForwardEntry|DeleteIpForwardEntry|SCDynamicStoreSetValue|NetworkManager|networksetup|netsh|nmcli' crates/*/src; then
            echo 'product code must not mutate persistent network configuration'
            exit 1
          fi

  native-conformance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Record exact conformance configuration
        shell: pwsh
        run: |
          rustc -Vv
          cargo -V
          "target=${{ matrix.target }}"
          "profile=release"
          "cargo_config_sha256=$((Get-FileHash .cargo/config.toml -Algorithm SHA256).Hash.ToLowerInvariant())"
          "rustflags=$env:RUSTFLAGS"
          "cargo_encoded_rustflags=$env:CARGO_ENCODED_RUSTFLAGS"
      - name: Full native conformance under the release target and linkage
        run: cargo test --release --workspace --all-targets --target ${{ matrix.target }} --locked -- --nocapture
      - name: Build under the same release target and linkage
        run: cargo build --release --target ${{ matrix.target }} --locked -p reach-cli
