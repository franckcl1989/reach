name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-source-and-quality:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Verify exact source and tag/version identity
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (git rev-parse HEAD).Trim()
          if ($source -ne '${{ github.sha }}') {
            throw "checked-out source $source differs from workflow source ${{ github.sha }}"
          }
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'reach-cli').version
          if (-not $version) {
            throw 'workspace version was not found'
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") {
            throw "tag ${{ github.ref_name }} does not match workspace version v$version"
          }
          "source_sha=$source"
          "workspace_version=$version"
          rustc -Vv
          cargo -V
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - name: Install pinned dependency-policy tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked
      - run: cargo audit
      - run: cargo machete --with-metadata

  build-inspect-package:
    needs: verify-source-and-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            artifact: linux-x86_64
            target: x86_64-unknown-linux-musl
            binary: reach
          - runner: ubuntu-22.04-arm
            platform: linux
            artifact: linux-aarch64
            target: aarch64-unknown-linux-musl
            binary: reach
          - runner: macos-15-intel
            platform: macos
            artifact: macos-x86_64
            target: x86_64-apple-darwin
            binary: reach
          - runner: macos-14
            platform: macos
            artifact: macos-aarch64
            target: aarch64-apple-darwin
            binary: reach
          - runner: windows-2022
            platform: windows
            artifact: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: reach.exe
          - runner: windows-11-arm
            platform: windows
            artifact: windows-aarch64
            target: aarch64-pc-windows-msvc
            binary: reach.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: llvm-tools-preview
      - name: Verify source and materialize release configuration identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (git rev-parse HEAD).Trim()
          if ($source -ne '${{ github.sha }}') {
            throw "checked-out source $source differs from workflow source ${{ github.sha }}"
          }
          $version = '${{ needs.verify-source-and-quality.outputs.version }}'
          $lockHash = (Get-FileHash Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant()
          $configHash = (Get-FileHash .cargo/config.toml -Algorithm SHA256).Hash.ToLowerInvariant()
          $provenance = 'reach-${{ matrix.artifact }}-provenance.txt'
          @(
            "source_sha=$source"
            "workspace_version=$version"
            "cargo_lock_sha256=$lockHash"
            "cargo_config_sha256=$configHash"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "runner_name=$env:RUNNER_NAME"
            "runner_image_os=$env:ImageOS"
            "runner_image_version=$env:ImageVersion"
            "target=${{ matrix.target }}"
            'profile=release'
            'features=default'
            "rustflags=$env:RUSTFLAGS"
            "cargo_encoded_rustflags=$env:CARGO_ENCODED_RUSTFLAGS"
            "windows_crt_static=$('${{ matrix.platform }}' -eq 'windows')"
            "linker_configuration=cargo target defaults plus .cargo/config.toml"
            "cargo=$(cargo -V)"
            'rustc:'
          ) | Set-Content -LiteralPath $provenance
          rustc -Vv | Add-Content -LiteralPath $provenance
          if ('${{ matrix.platform }}' -eq 'linux') {
            "kernel=$(uname -r)" | Add-Content -LiteralPath $provenance
            "user_space=$(Get-Content /etc/os-release | Out-String)" | Add-Content -LiteralPath $provenance
          } elseif ('${{ matrix.platform }}' -eq 'macos') {
            "os_version=$(sw_vers -productVersion)" | Add-Content -LiteralPath $provenance
            "kernel=$(uname -r)" | Add-Content -LiteralPath $provenance
          } else {
            "os_version=$([System.Environment]::OSVersion.VersionString)" | Add-Content -LiteralPath $provenance
          }
          Get-Content -LiteralPath $provenance
      - name: Full native conformance under the final target/linkage configuration
        run: cargo test --release --workspace --all-targets --target ${{ matrix.target }} --locked -- --nocapture
      - name: Build the final release target under the same configuration
        run: cargo build --release --target ${{ matrix.target }} --locked -p reach-cli
      - name: Inspect, package exactly one executable, extract, inspect again, and smoke
        shell: pwsh
        run: |
          ./scripts/release/package-and-smoke.ps1 `
            -BinaryPath 'target/${{ matrix.target }}/release/${{ matrix.binary }}' `
            -BinaryName '${{ matrix.binary }}' `
            -Platform '${{ matrix.platform }}' `
            -Artifact '${{ matrix.artifact }}' `
            -Version '${{ needs.verify-source-and-quality.outputs.version }}'
      - name: Old and current enterprise Linux user-space smoke
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -r)" == 6.8.* ]]
          extracted="$PWD/release-work/${{ matrix.artifact }}/extracted"
          for image in rockylinux:8 rockylinux:9; do
            docker pull "$image"
            digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
            echo "compatibility_image=$digest" | tee -a reach-${{ matrix.artifact }}-provenance.txt
            docker run --rm -v "$extracted:/work:ro" "$image" /work/reach --version
            set +e
            docker run --rm -v "$extracted:/work:ro" "$image" /work/reach not/an/address
            status=$?
            set -e
            test "$status" -eq 2
          done
      - name: Complete artifact-bound provenance
        shell: pwsh
        run: |
          $provenance = 'reach-${{ matrix.artifact }}-provenance.txt'
          Get-Content 'reach-${{ matrix.artifact }}-artifact-verification.txt' | Add-Content $provenance
          'raw_dependency_inspection:' | Add-Content $provenance
          Get-Content 'reach-${{ matrix.artifact }}-dependencies-raw.txt' | Add-Content $provenance
          'extracted_dependency_inspection:' | Add-Content $provenance
          Get-Content 'reach-${{ matrix.artifact }}-dependencies-extracted.txt' | Add-Content $provenance
      - name: Upload verified release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            reach-${{ matrix.artifact }}.tar
            reach-${{ matrix.artifact }}-provenance.txt

  windows-client-compatibility:
    needs: [verify-source-and-quality, build-inspect-package]
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-windows-*
          path: dist
          merge-multiple: true
      - name: Run native ARM64 and emulated x86-64 archives on Windows 11 client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($architecture in @('aarch64', 'x86_64')) {
            $directory = "extracted-$architecture"
            New-Item -ItemType Directory -Path $directory | Out-Null
            tar -xf "dist/reach-windows-$architecture.tar" -C $directory
            if ($LASTEXITCODE -ne 0) {
              throw "could not extract Windows $architecture archive"
            }
            $output = (& "./$directory/reach.exe" --version 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $output -ne 'reach ${{ needs.verify-source-and-quality.outputs.version }}') {
              throw "Windows 11 $architecture compatibility smoke failed: $output"
            }
            & "./$directory/reach.exe" 'not/an/address' 2>$null | Out-Null
            if ($LASTEXITCODE -ne 2) {
              throw "Windows 11 $architecture invalid-input smoke must exit 2"
            }
          }
          # The final successful assertion intentionally leaves the native exit code at 2.
          # Return success explicitly so the GitHub pwsh wrapper does not propagate it.
          exit 0

  publish:
    if: github.ref_type == 'tag'
    needs: [verify-source-and-quality, build-inspect-package, windows-client-compatibility]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify complete release set and generate combined evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem dist/reach-*.tar)
          $provenance = @(Get-ChildItem dist/reach-*-provenance.txt)
          if ($archives.Count -ne 6 -or $provenance.Count -ne 6) {
            throw "expected six archives and six provenance files; got $($archives.Count) and $($provenance.Count)"
          }
          $version = '${{ needs.verify-source-and-quality.outputs.version }}'
          $tagTarget = (git rev-list -n 1 '${{ github.ref_name }}').Trim()
          if ($tagTarget -ne '${{ github.sha }}') {
            throw "tag target $tagTarget differs from workflow source ${{ github.sha }}"
          }
          $evidence = "dist/reach-$version-release-evidence.txt"
          @(
            "release=v$version"
            "source_sha=${{ github.sha }}"
            "tag=${{ github.ref_name }}"
            "tag_target=$tagTarget"
            "workflow_run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            "cargo_lock_sha256=$((Get-FileHash Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant())"
            'rust_toolchain_policy=unpinned stable by explicit project-owner decision; exact versions follow per target'
            'signing_policy=unsigned exception; no Authenticode, Apple Developer ID/notarization, or detached Linux signing credentials are configured'
            ''
          ) | Set-Content $evidence
          foreach ($file in ($provenance | Sort-Object Name)) {
            "===== $($file.Name) =====" | Add-Content $evidence
            Get-Content $file.FullName | Add-Content $evidence
          }
          $publicAssets = $archives + @(Get-Item $evidence)
          $sums = foreach ($file in ($publicAssets | Sort-Object Name)) {
            "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($file.Name)"
          }
          $sums | Set-Content dist/SHA256SUMS
      - name: Publish atomically through a verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ github.ref_name }}'
          version='${{ needs.verify-source-and-quality.outputs.version }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; assets are never replaced"
            exit 1
          fi
          gh release create "$tag" --verify-tag --draft --title "reach $tag" --notes-from-tag \
            dist/reach-*.tar dist/SHA256SUMS "dist/reach-$version-release-evidence.txt"
          asset_count="$(gh release view "$tag" --json assets --jq '.assets | length')"
          test "$asset_count" -eq 8
          gh release edit "$tag" --draft=false
