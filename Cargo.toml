[workspace]
members = [
    "crates/reach-cli",
    "crates/reach-core",
    "crates/reach-platform",
]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
publish = false

[workspace.dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.6", default-features = false, features = ["color", "derive", "error-context", "help", "std", "suggestions", "usage", "wrap_help"] }
comfy-table = "7.2.1"
assert_cmd = "2.2.2"
ctrlc = "3.5.2"
dns-lookup = "3.0.1"
futures-util = "0.3.32"
gai-core = "0.5.1"
hickory-proto = { version = "0.26.1", default-features = false, features = ["std"] }
hostname-validator = "1.1.1"
humantime = "2.3.0"
idna = "1.1.0"
indicatif = "0.18.6"
ipnet = "2.12.1"
ipconfig = "0.3.4"
libc = "0.2.189"
mach2 = "0.6.0"
netdev = { version = "0.46.1", default-features = false }
netroute = "0.4.0"
rtnetlink = "0.22.0"
netlink-packet-route = "0.32.1"
rustix = { version = "1.1.4", features = ["time"] }
resolv-conf = "0.7.6"
proptest = "1.11.0"
send_ctrlc = "0.6.0"
snapbox = "1.2.2"
surge-ping = "0.9.0"
system-configuration = "0.8.0"
terminal_size = "0.4.4"
tempfile = "3.27.0"
textwrap = "0.16.2"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
unicode-general-category = "1.1.0"
unicode-width = "0.2.2"
windows-sys = "0.61.2"
wait-timeout = "0.2.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
